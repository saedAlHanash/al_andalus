name: al_andalus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2.5
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  local_auth: ^2.2.0
  flutter_secure_storage: ^10.2.0


  drawable_text: ^1.0.0

  image_multi_type: ^1.0.5

  m_cubit:
    git:
      url: https://github.com/saedAlHanash/m_cubit

  cupertino_icons: ^1.0.9
  intl_utils: ^2.8.16

  flutter_cached_pdfview: ^0.4.4
  go_router: ^17.3.0
  group_button: ^5.3.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.2
  logger: ^2.7.0
  dropdown_button2: ^3.1.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_remote_config: ^6.5.3
  intl: ^0.20.2
  collection: ^1.19.1
  flutter_local_notifications: ^22.0.1
  package_info_plus:
  awesome_dialog:
  pull_to_refresh: ^2.0.0
  string_similarity: ^2.2.0
  easy_stepper:
  flutter_image_compress: ^2.4.0
  image: ^4.9.1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  lottie: ^3.3.3
  whatsapp_unilink: ^2.1.0
  flutter_inappwebview: ^6.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  webview_flutter: ^4.14.0
  camera: ^0.12.0+1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  intl_phone_field: ^3.2.0
  app_links: ^7.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

dependency_overrides:
  awesome_dialog: 3.2.1
  dropdown_button2: ^2.3.9
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/lotties/
    - assets/
  fonts:
    - family: regular
      fonts:
        - asset: assets/fonts/Alyamama-Regular.ttf
    - family: semeBold
      fonts:
        - asset: assets/fonts/Alyamama-SemiBold.ttf
    - family: bold
      fonts:
        - asset: assets/fonts/Alyamama-Bold.ttf

flutter_intl:
  enabled: true